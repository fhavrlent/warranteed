name: Pull request image

# Pull request 42 -> :pr-42, rebuilt on every push to its branch.
#
# pull_request_target runs this file as it is on main, never a pull
# request's own version, so a branch can't change where images go or what
# else the token is used for. Its code is only built: no step here runs it,
# and the build can't reach the registry login. It uses no build cache:
# GitHub doesn't let pull_request_target runs write to it, and it keeps
# pull request builds out of the release builds' cache.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  packages: write

jobs:
  image:
    # Pull requests from forks get no image.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/warranteed:pr-${{ github.event.pull_request.number }}
          build-args: VERSION=pr-${{ github.event.pull_request.number }}
